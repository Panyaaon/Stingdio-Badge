<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>STINGDiO Badge Maker</title>
<style>
:root{--pink:#ff5fa2;--soft:#ffe8f2;--black:#151515;--muted:#777}
*{box-sizing:border-box}
html,body{overscroll-behavior:none}
body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:linear-gradient(#fff,#fff7fb);color:var(--black)}
.app{max-width:560px;margin:auto;min-height:100vh;padding:16px 16px 120px}
.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{font-size:25px;font-weight:900}.logo span{color:var(--pink)}
.pill{font-size:11px;background:#111;color:#fff;border-radius:999px;padding:7px 10px}
h1{font-size:24px;margin:8px 0 4px}
.sub{font-size:14px;color:var(--muted);line-height:1.45;margin-bottom:12px}
.card{background:#fff;border:2px solid #111;border-radius:22px;padding:14px;margin:14px 0;box-shadow:6px 6px 0 var(--soft)}
.stage-wrap{display:flex;justify-content:center;padding:8px 0 2px}
.stage{position:relative;width:min(84vw,390px);aspect-ratio:1;border-radius:50%;overflow:hidden;background:#eee;border:3px solid #111;touch-action:none}
#photo{position:absolute;left:50%;top:50%;max-width:none;max-height:none;display:none;user-select:none;-webkit-user-drag:none;pointer-events:none;transform-origin:center;z-index:1}
.safe{position:absolute;inset:10%;border:2px dashed rgba(255,95,162,.9);border-radius:50%;pointer-events:none;z-index:30}
#stickerLayer{position:absolute;inset:0;z-index:12;pointer-events:none}
.place{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(1);transform-origin:center;touch-action:none;pointer-events:auto;user-select:none;z-index:20}
.place.emoji{font-size:44px;line-height:1}
.place.selected,#textObject.selected{outline:2px dashed var(--pink);outline-offset:5px;border-radius:8px}
#textObject{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%) scale(1) rotate(0deg);
  transform-origin:center;z-index:18;touch-action:none;user-select:none;
  font-weight:900;font-size:30px;text-align:center;white-space:pre-wrap;
  max-width:82%;padding:2px 4px;line-height:1.05;cursor:grab
}
.field{margin-top:10px}
.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}
input[type=file],input[type=text],select,input[type=color]{
  width:100%;border:2px solid #111;border-radius:12px;padding:10px;background:#fff;font:inherit
}
input[type=color]{height:46px;padding:4px}
input[type=range]{width:100%}
.text-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sticker-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:10px}
.sticker-grid button{font-size:25px;padding:8px 0;min-height:48px;border-radius:12px}
button{font:inherit;border:2px solid #111;background:#fff;border-radius:13px;padding:10px;font-weight:800;cursor:pointer}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.hint{font-size:12px;color:var(--muted);text-align:center;line-height:1.45;margin-top:8px}
.footer{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:2px solid #eee;padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:100}
.footer-inner{max-width:560px;margin:auto;display:grid;grid-template-columns:.8fr 1fr 1.2fr;gap:8px}
.black{background:#111;color:#fff}.pink{background:var(--pink);color:#fff}
.status{font-size:11px;color:#777;text-align:center;margin-top:6px}

.upload-sticker-btn{
  display:block;
  width:100%;
  margin-top:12px;
  padding:11px;
  text-align:center;
  border:2px solid #111;
  border-radius:13px;
  background:#fff0f6;
  font-weight:800;
  cursor:pointer
}
#stickerUpload{display:none}
.place.uploaded{
  width:90px;
  height:auto;
  object-fit:contain
}


.delete-handle{
  position:absolute;
  width:24px;
  height:24px;
  border-radius:50%;
  background:#111;
  color:#fff;
  border:2px solid #fff;
  display:none;
  align-items:center;
  justify-content:center;
  font:900 16px/1 Arial,sans-serif;
  box-shadow:0 1px 4px rgba(0,0,0,.28);
  z-index:80;
  cursor:pointer;
  touch-action:manipulation;
  user-select:none;
}
.delete-handle.show{display:flex}

@media(max-width:400px){.sticker-grid{grid-template-columns:repeat(6,1fr)}}
@media print{
  body *{visibility:hidden!important}
  #printArea,#printArea *{visibility:visible!important}
  #printArea{display:flex!important;position:absolute;left:0;top:0;width:100%;justify-content:center;padding-top:10mm}
  #printImg{width:58mm;height:58mm;object-fit:contain}
}

.place,#textObject{
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  cursor:grab;
}
.place.selected,#textObject.selected{
  outline:2px dashed rgba(0,0,0,.7);
  outline-offset:6px;
}



.bg-controls{margin-top:10px;padding:12px;border:1.5px solid #111;border-radius:16px;background:#fff}
.bg-control-row{margin-bottom:12px}
.bg-control-row:last-of-type{margin-bottom:10px}
.bg-control-row>label,.bg-label-line label{display:block;font-size:12px;font-weight:900;margin-bottom:5px}
.bg-label-line{display:flex;align-items:center;justify-content:space-between}
.bg-label-line span{font-size:11px;font-weight:800;opacity:.65}
.bg-controls input[type=range]{width:100%;accent-color:#111}
.bg-center-btn{width:100%;border:1.5px solid #111;border-radius:12px;background:#fff;padding:9px 12px;font-weight:900;letter-spacing:.4px}
.bg-move-grid{grid-template-rows:repeat(3,38px)}

</style>
</head>

<script>
const BADGE_MM=58;
const stage=document.getElementById('stage');
const photo=document.getElementById('photo');
const layer=document.getElementById('stickerLayer');
const textObject=document.getElementById('textObject');
const textInput=document.getElementById('textInput');
const fontSelect=document.getElementById('fontSelect');
const textColor=document.getElementById('textColor');
const shadowColor=document.getElementById('shadowColor');
const shadowDistance=document.getElementById('shadowDistance');
const shadowAngle=document.getElementById('shadowAngle');
const shadowBlur=document.getElementById('shadowBlur');
const shadowAngleValue=document.getElementById('shadowAngleValue');
const printBtn=document.getElementById('printBtn');
const printStatus={set textContent(v){}};
const deleteHandle=document.getElementById('deleteHandle');

function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function midpoint(a,b){return {x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
function angle(a,b){return Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI}
function normAngleDelta(d){
  while(d>180)d-=360;
  while(d<-180)d+=360;
  return d;
}

function updateDeleteHandle(){
  if(!selectedTarget){
    deleteHandle.classList.remove('show');
    return;
  }
  const sr=stage.getBoundingClientRect();
  const tr=selectedTarget.getBoundingClientRect();
  let x=tr.right-sr.left-10;
  let y=tr.top-sr.top-10;
  x=clamp(x,2,sr.width-26);
  y=clamp(y,2,sr.height-26);
  deleteHandle.style.left=x+'px';
  deleteHandle.style.top=y+'px';
  deleteHandle.classList.add('show');
}
deleteHandle.addEventListener('pointerdown',e=>{
  e.stopPropagation();
  e.preventDefault();
});
deleteHandle.addEventListener('click',e=>{
  e.stopPropagation();
  if(!selectedTarget)return;
  if(selectedTarget===textObject){
    textInput.value='';
    textObject.textContent='';
    textObject.classList.remove('selected');
  }else{
    selectedTarget.remove();
  }
  selectedSticker=null;
  selectedTarget=null;
  deleteHandle.classList.remove('show');
});


let base={x:0,y:0,scale:1,rotation:0};
let basePointers=new Map(),baseStart=null;
let selectedSticker=null,selectedTarget=null,zCounter=30,wifiStep=false;

/* Main photo */
document.getElementById('photoUpload').addEventListener('change',e=>{
  const file=e.target.files && e.target.files[0];
  if(!file)return;

  const reader=new FileReader();
  reader.onload=ev=>{
    photo.onload=()=>{
      photo.style.display='block';
      const sw=stage.clientWidth || 390;
      const sh=stage.clientHeight || 390;
      const cover=Math.max(sw/photo.naturalWidth,sh/photo.naturalHeight);
      photo.style.width=(photo.naturalWidth*cover)+'px';
      photo.style.height=(photo.naturalHeight*cover)+'px';
      photo.style.left='50%';
      photo.style.top='50%';
      base={x:0,y:0,scale:1,rotation:0};
      bgZoom.value='1'; bgX.value='0'; bgY.value='0'; bgXValue.textContent='0'; bgYValue.textContent='0';
      updateBase();
    };
    photo.src=ev.target.result;
  };
  reader.readAsDataURL(file);
});
function updateBase(){photo.style.transform=`translate(calc(-50% + ${base.x}px),calc(-50% + ${base.y}px)) scale(${base.scale}) rotate(${base.rotation}deg)`}

const bgZoom=document.getElementById('bgZoom');
const bgX=document.getElementById('bgX');
const bgY=document.getElementById('bgY');
const bgXValue=document.getElementById('bgXValue');
const bgYValue=document.getElementById('bgYValue');
const bgCenter=document.getElementById('bgCenter');

bgZoom.addEventListener('input',()=>{
  base.scale=+bgZoom.value;
  updateBase();
});
bgX.addEventListener('input',()=>{
  base.x=+bgX.value;
  bgXValue.textContent=bgX.value;
  updateBase();
});
bgY.addEventListener('input',()=>{
  base.y=+bgY.value;
  bgYValue.textContent=bgY.value;
  updateBase();
});
bgCenter.addEventListener('click',()=>{
  base.x=0;
  base.y=0;
  bgX.value='0';
  bgY.value='0';
  bgXValue.textContent='0';
  bgYValue.textContent='0';
  updateBase();
});



// Background touch gestures disabled: background is locked.


/* Text object */
let txt={x:50,y:50,scale:1,rotation:0};
let txtPointers=new Map(),txtStart=null;

function activeFont(){return fontSelect.value}
function updateText(){
  textObject.textContent=textInput.value;
  textObject.style.left=txt.x+'%';
  textObject.style.top=txt.y+'%';
  textObject.style.transform=`translate(-50%,-50%) scale(${txt.scale}) rotate(${txt.rotation}deg)`;
  textObject.style.fontFamily=`"${activeFont()}",sans-serif`;
  textObject.style.color=textColor.value;

  const d=+shadowDistance.value;
  const a=(+shadowAngle.value)*Math.PI/180;
  const sx=Math.cos(a)*d;
  const sy=Math.sin(a)*d;
  const blur=+shadowBlur.value;
  textObject.style.textShadow=`${sx}px ${sy}px ${blur}px ${shadowColor.value}`;
  shadowAngleValue.textContent=shadowAngle.value+'°';
}
[textInput,fontSelect,textColor,shadowColor,shadowDistance,shadowAngle,shadowBlur].forEach(el=>el.addEventListener('input',updateText));
fontSelect.addEventListener('change',updateText);


const textPointers=new Map();
let textGesture=null;

function selectTextObject(){
  if(!textInput.value.trim()) return;
  deselectAll();
  textObject.classList.add('selected');
  selectedTarget=textObject;
  updateDeleteHandle();
}

textObject.addEventListener('pointerdown',e=>{
  e.preventDefault();
  e.stopPropagation();
  selectTextObject();
  try{textObject.setPointerCapture(e.pointerId)}catch(_){}
  textPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  const pts=[...textPointers.values()];
  if(pts.length===1){
    textGesture={
      mode:'drag',
      startX:pts[0].x,startY:pts[0].y,
      x:txt.x,y:txt.y,scale:txt.scale,rotation:txt.rotation
    };
  }else if(pts.length===2){
    textGesture={
      mode:'pinch',
      distance:Math.max(1,distance(pts[0],pts[1])),
      angle:angle(pts[0],pts[1]),
      midpoint:midpoint(pts[0],pts[1]),
      x:txt.x,y:txt.y,scale:txt.scale,rotation:txt.rotation
    };
  }
});

textObject.addEventListener('pointermove',e=>{
  if(!textPointers.has(e.pointerId)||!textGesture)return;
  e.preventDefault();
  e.stopPropagation();
  textPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const pts=[...textPointers.values()];
  const r=stage.getBoundingClientRect();

  if(pts.length===1 && textGesture.mode==='drag'){
    txt.x=textGesture.x+(pts[0].x-textGesture.startX)/r.width*100;
    txt.y=textGesture.y+(pts[0].y-textGesture.startY)/r.height*100;
  }else if(pts.length>=2){
    if(textGesture.mode!=='pinch'){
      textGesture={
        mode:'pinch',
        distance:Math.max(1,distance(pts[0],pts[1])),
        angle:angle(pts[0],pts[1]),
        midpoint:midpoint(pts[0],pts[1]),
        x:txt.x,y:txt.y,scale:txt.scale,rotation:txt.rotation
      };
      return;
    }
    const d=Math.max(1,distance(pts[0],pts[1]));
    const a=angle(pts[0],pts[1]);
    const mid=midpoint(pts[0],pts[1]);
    txt.scale=clamp(textGesture.scale*(d/textGesture.distance),0.2,8);
    txt.rotation=textGesture.rotation+normAngleDelta(a-textGesture.angle);
    txt.x=textGesture.x+(mid.x-textGesture.midpoint.x)/r.width*100;
    txt.y=textGesture.y+(mid.y-textGesture.midpoint.y)/r.height*100;
  }
  updateText();
  updateDeleteHandle();
});

function endTextPointer(e){
  textPointers.delete(e.pointerId);
  const pts=[...textPointers.values()];
  if(pts.length===1){
    textGesture={
      mode:'drag',
      startX:pts[0].x,startY:pts[0].y,
      x:txt.x,y:txt.y,scale:txt.scale,rotation:txt.rotation
    };
  }else{
    textGesture=null;
  }
}
textObject.addEventListener('pointerup',endTextPointer);
textObject.addEventListener('pointercancel',endTextPointer);
textObject.addEventListener('lostpointercapture',endTextPointer);
document.getElementById('stickerUpload').addEventListener('change',e=>{
  const file=e.target.files[0];
  if(!file)return;

  const el=document.createElement('img');
  el.className='place uploaded';
  el.src=URL.createObjectURL(file);
  el.dataset.x='50';
  el.dataset.y='50';
  el.dataset.scale='1';
  el.dataset.rotation='0';
  el.style.zIndex=++zCounter;

  el.onload=()=>{
    layer.appendChild(el);
    prepareSticker(el);
    selectSticker(el);
  };

  e.target.value='';
});

/* Stickers */
function addEmoji(emoji){
  const el=document.createElement('div');
  el.className='place emoji'; el.textContent=emoji;
  el.dataset.x='50'; el.dataset.y='50'; el.dataset.scale='1'; el.dataset.rotation='0';
  el.style.zIndex=++zCounter;
  layer.appendChild(el); prepareSticker(el); selectSticker(el);
}
function prepareSticker(el){
  updateSticker(el);
  el.style.touchAction='none';
  el._ptr=new Map();
  el._gesture=null;

  el.addEventListener('pointerdown',e=>{
    e.preventDefault();
    e.stopPropagation();
    selectSticker(el);
    try{el.setPointerCapture(e.pointerId)}catch(_){}
    el._ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const pts=[...el._ptr.values()];
    const state={
      x:+el.dataset.x,
      y:+el.dataset.y,
      scale:+el.dataset.scale,
      rotation:+(el.dataset.rotation||0)
    };
    if(pts.length===1){
      el._gesture={
        mode:'drag',
        startX:pts[0].x,startY:pts[0].y,
        ...state
      };
    }else if(pts.length===2){
      el._gesture={
        mode:'pinch',
        distance:Math.max(1,distance(pts[0],pts[1])),
        angle:angle(pts[0],pts[1]),
        midpoint:midpoint(pts[0],pts[1]),
        ...state
      };
    }
  });

  el.addEventListener('pointermove',e=>{
    if(!el._ptr.has(e.pointerId)||!el._gesture)return;
    e.preventDefault();
    e.stopPropagation();
    el._ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const pts=[...el._ptr.values()];
    const r=stage.getBoundingClientRect();

    let x=+el.dataset.x,y=+el.dataset.y,scale=+el.dataset.scale,rotation=+(el.dataset.rotation||0);

    if(pts.length===1 && el._gesture.mode==='drag'){
      x=el._gesture.x+(pts[0].x-el._gesture.startX)/r.width*100;
      y=el._gesture.y+(pts[0].y-el._gesture.startY)/r.height*100;
    }else if(pts.length>=2){
      if(el._gesture.mode!=='pinch'){
        el._gesture={
          mode:'pinch',
          distance:Math.max(1,distance(pts[0],pts[1])),
          angle:angle(pts[0],pts[1]),
          midpoint:midpoint(pts[0],pts[1]),
          x,y,scale,rotation
        };
        return;
      }
      const d=Math.max(1,distance(pts[0],pts[1]));
      const a=angle(pts[0],pts[1]);
      const mid=midpoint(pts[0],pts[1]);
      scale=clamp(el._gesture.scale*(d/el._gesture.distance),0.2,8);
      rotation=el._gesture.rotation+normAngleDelta(a-el._gesture.angle);
      x=el._gesture.x+(mid.x-el._gesture.midpoint.x)/r.width*100;
      y=el._gesture.y+(mid.y-el._gesture.midpoint.y)/r.height*100;
    }

    el.dataset.x=x;
    el.dataset.y=y;
    el.dataset.scale=scale;
    el.dataset.rotation=rotation;
    updateSticker(el);
    updateDeleteHandle();
  });

  function endStickerPointer(e){
    el._ptr.delete(e.pointerId);
    const pts=[...el._ptr.values()];
    if(pts.length===1){
      el._gesture={
        mode:'drag',
        startX:pts[0].x,startY:pts[0].y,
        x:+el.dataset.x,y:+el.dataset.y,
        scale:+el.dataset.scale,
        rotation:+(el.dataset.rotation||0)
      };
    }else{
      el._gesture=null;
    }
  }
  el.addEventListener('pointerup',endStickerPointer);
  el.addEventListener('pointercancel',endStickerPointer);
  el.addEventListener('lostpointercapture',endStickerPointer);
}
function updateSticker(el){el.style.left=el.dataset.x+'%';el.style.top=el.dataset.y+'%';el.style.transform=`translate(-50%,-50%) scale(${el.dataset.scale}) rotate(${el.dataset.rotation||0}deg)`}
function selectSticker(el){deselectAll();selectedSticker=el;selectedTarget=el;el.classList.add('selected');updateDeleteHandle()}
function deselectAll(){document.querySelectorAll('.place.selected').forEach(x=>x.classList.remove('selected'));textObject.classList.remove('selected');selectedSticker=null;selectedTarget=null;deleteHandle.classList.remove('show')}
/* Reset */
function resetAll(){
  base={x:0,y:0,scale:1,rotation:0}; bgZoom.value='1'; bgX.value='0'; bgY.value='0'; bgXValue.textContent='0'; bgYValue.textContent='0'; updateBase();
  txt={x:50,y:50,scale:1,rotation:0};
  textInput.value=''; textColor.value='#111111'; shadowColor.value='#ff8fbd'; shadowDistance.value='4'; shadowAngle.value='45'; shadowBlur.value='2';
  fontSelect.selectedIndex=0; updateText();
  layer.innerHTML=''; deselectAll();
  wifiStep=false; printBtn.textContent='PRINT'; printStatus.textContent='';
}

/* Render */
async function renderCanvas(){
  if(!photo.src){alert('กรุณาอัปโหลดรูปหลักก่อน');throw new Error('no photo')}
  deselectAll();
  const px=Math.round(BADGE_MM/25.4*300),c=document.getElementById('canvas'),ctx=c.getContext('2d');
  c.width=c.height=px;
  ctx.save();ctx.beginPath();ctx.arc(px/2,px/2,px/2,0,Math.PI*2);ctx.clip();ctx.fillStyle='#eee';ctx.fillRect(0,0,px,px);
  const f=px/stage.clientWidth,pw=parseFloat(photo.style.width)*f,ph=parseFloat(photo.style.height)*f;
  ctx.translate(px/2+base.x*f,px/2+base.y*f);ctx.rotate(base.rotation*Math.PI/180);ctx.scale(base.scale,base.scale);ctx.drawImage(photo,-pw/2,-ph/2,pw,ph);ctx.restore();

  const text=textInput.value.trim();
  if(text){
    ctx.save();
    ctx.translate(txt.x/100*px,txt.y/100*px);
    ctx.rotate(txt.rotation*Math.PI/180);
    ctx.scale(txt.scale,txt.scale);
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
    ctx.font=`900 ${Math.round(px*.09)}px "${activeFont()}",sans-serif`;
    const d=+shadowDistance.value*(px/stage.clientWidth);
    const a=(+shadowAngle.value)*Math.PI/180;
    ctx.shadowColor=shadowColor.value;
    ctx.shadowOffsetX=Math.cos(a)*d;
    ctx.shadowOffsetY=Math.sin(a)*d;
    ctx.shadowBlur=+shadowBlur.value*(px/stage.clientWidth);
    ctx.fillStyle=textColor.value;
    ctx.fillText(text,0,0,px*.72);
    ctx.restore();
  }

  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const el of document.querySelectorAll('.place')){
    const x=+el.dataset.x/100*px,y=+el.dataset.y/100*px,s=+el.dataset.scale,r=+(el.dataset.rotation||0);
    if(el.classList.contains('uploaded')){
      const w=px*.23*s;
      const ratio=(el.naturalHeight/el.naturalWidth)||1;
      const h=w*ratio;
      ctx.save();ctx.translate(x,y);ctx.rotate(r*Math.PI/180);ctx.drawImage(el,-w/2,-h/2,w,h);ctx.restore();
    }else{
      ctx.save();ctx.translate(x,y);ctx.rotate(r*Math.PI/180);ctx.font=`${Math.round(px*.115*s)}px Arial`;ctx.fillText(el.textContent,0,0);ctx.restore();
    }
  }
  return c;
}
async function savePNG(){
  try{const c=await renderCanvas();c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='STINGDiO_badge_58mm.png';a.click()},'image/png')}catch(e){}
}

/* Print */
function openWifiSettings(){
  const ua=navigator.userAgent||'';
  if(/iPhone|iPad|iPod/i.test(ua)){window.location.href='App-Prefs:root=WIFI';setTimeout(()=>window.location.href='prefs:root=WIFI',700)}
  else if(/Android/i.test(ua)){window.location.href='intent:#Intent;action=android.settings.WIFI_SETTINGS;end'}
  else{alert('กรุณาเชื่อมต่อ Wi‑Fi เดียวกับเครื่องพิมพ์ แล้วกลับมากด PRINT NOW')}
}
async function printFlow(){
  if(!wifiStep){wifiStep=true;printBtn.textContent='PRINT NOW';printStatus.textContent='เชื่อม Wi‑Fi เดียวกับเครื่องพิมพ์ แล้วกลับมากด PRINT NOW';openWifiSettings();return}
  try{const c=await renderCanvas(),img=document.getElementById('printImg');img.src=c.toDataURL('image/png');img.onload=()=>window.print()}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&wifiStep){printBtn.textContent='PRINT NOW';printStatus.textContent='ถ้าเชื่อม Wi‑Fi แล้ว กด PRINT NOW เพื่อเลือกเครื่องพิมพ์'}});

updateText();
</script>
